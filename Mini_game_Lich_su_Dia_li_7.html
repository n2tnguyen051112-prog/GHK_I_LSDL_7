<style>

;letter-spacing:2px}.hero h1{font-size:clamp(2.25rem,5.9vw,4.1rem);line-height:1.08;letter-spacing:-2px;margin:13px 0}.hero h1 em{color:var(--gold);font-style:normal}.hero p{color:#d7e3fa;margin:0;max-width:620px;font-size:1.03rem}.chipline{display:flex;gap:8px;flex-wrap:wrap;margin-top:21px}.chip{border:1px solid #ffffff43;border-radius:100px;padding:7px 12px;background:#ffffff12;font-size:.79rem;color:#ebf3ff;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:17px 0 23px}.stat{border:1px solid var(--line);border-radius:18px;padding:14px 17px;background:#131b34bb}.stat strong{display:block;font-size:1.38rem}.stat span{font-size:.78rem;color:var(--muted)}.section-title{font-size:1.28rem;font-weight:850;margin:26px 0 13px}.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.mode{min-height:150px;text-align:left;border:1px solid var(--line);border-radius:21px;padding:20px;background:var(--panel);color:var(--text);transition:transform .16s,border-color .16s,background .16s;position:relative;overflow:hidden}.mode:hover{transform:translateY(-3px);border-color:#8091d4;background:#1a2241}.mode:active{transform:scale(.98)}.mode .em{font-size:2rem;display:block;margin-bottom:8px}.mode strong{display:block;font-size:1.08rem}.mode .desc{display:block;color:var(--muted);font-size:.84rem;margin-top:5px;max-width:98%}.mode .best{display:inline-flex;color:var(--gold);font-size:.76rem;margin-top:8px;font-weight:750}.info-box{border:1px solid #344468;border-radius:17px;background:#11243c95;padding:16px 18px;color:#c9d9f2;margin-top:23px;font-size:.86rem}.info-box strong{color:var(--gold)}.footer{text-align:center;color:#7e91bb;font-size:.74rem;margin-top:36px}.subject-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:3px}.subj-label{color:var(--cyan);font-weight:850;font-size:.78rem;letter-spacing:1px;text-transform:uppercase}.counter{color:var(--muted);font-weight:750;font-size:.84rem}.progress{width:100%;height:9px;background:#2d3454;border-radius:12px;overflow:hidden;margin:15px 0 15px}.progress>div{height:100%;width:0%;background:linear-gradient(90deg,#5e91ff,#68e4d8);border-radius:12px;transition:width .25s}.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:15px}.tool{background:#162540;border:1px solid var(--line);color:#e5f0ff;padding:9px 12px;border-radius:12px;font-size:.86rem;font-weight:800}.playcard{border:1px solid #3c4979;background:linear-gradient(165deg,#1c2445,#11182e);border-radius:25px;padding:clamp(17px,3.2vw,29px);box-shadow:0 20px 50px #0004}.question-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}.pill{border-radius:10px;padding:5px 10px;background:#394b83;color:#e6efff;font-size:.73rem;font-weight:850}.pill.geo{background:#155654;color:#adfff2}.question-title{font-size:clamp(1.14rem,3vw,1.45rem);line-height:1.49;font-weight:790;margin:19px 0 20px;white-space:pre-line}.context{color:#e4edff;background:#263556;border:1px solid #415582;border-radius:16px;padding:15px;margin:12px 0 19px;font-size:.94rem}.answers{display:grid;gap:11px}.answer{width:100%;min-height:59px;background:#222c4e;border:1.5px solid #3a4873;padding:13px 15px;text-align:left;border-radius:15px;color:var(--text);display:flex;align-items:center;gap:12px;line-height:1.45;transition:background .13s,border-color .13s}.answer:not(:disabled):hover{background:#303d69}.letter{border:1px solid #60719a;display:grid;place-items:center;width:32px;height:32px;min-width:32px;border-radius:10px;font-weight:850;color:#dfe9ff}.answer.selected{border-color:var(--blue);background:#263b6c}.answer.correct{border-color:var(--good);background:#194a40}.answer.wrong{border-color:var(--bad);background:#4e2a43}.answer.correct .letter{background:#316d58;color:white}.answer.wrong .letter{background:#853e50;color:white}.feedback{border:1px solid #44668a;border-radius:17px;background:#182f45;padding:16px;margin-top:18px}.feedback.good{border-color:#38896c;background:#15382f}.feedback.bad{border-color:#a95766;background:#3b2736}.feedback .fbhead{font-size:1rem;font-weight:900;margin-bottom:6px}.feedback p{margin:4px 0;font-size:.94rem;color:#f0f4ff;line-height:1.65}.note{margin:15px 0 3px;border-left:3px solid var(--gold);background:#47392448;padding:11px 13px;color:#ffe9ad;font-size:.86rem;border-radius:0 10px 10px 0}.next,.primary{display:flex;align-items:center;justify-content:center;min-height:53px;border:none;border-radius:15px;padding:12px 18px;background:linear-gradient(95deg,#6394ff,#4ccbc3);color:#0d1732;font-weight:900;box-shadow:0 8px 22px #4789fc36;width:100%;margin-top:17px}.next:hover,.primary:hover{filter:brightness(1.06)}.secondary{background:transparent;border:1px solid #5872a6;border-radius:13px;color:#e5efff;padding:11px 14px;font-weight:800}.tfrow{padding:13px 0;border-bottom:1px solid var(--line)}.tfrow:last-child{border-bottom:0}.tfword{font-size:.95rem;margin:0 0 11px;line-height:1.52}.tfcontrols{display:flex;gap:9px}.tfbtn{border:1px solid #4c5b84;border-radius:10px;color:#dce8ff;background:#202f51;padding:8px 14px;min-width:94px;font-size:.84rem;font-weight:800}.tfbtn.active{background:#526da8;color:white;border-color:#87b4ff}.tfbtn.answertrue{border-color:var(--good);background:#1a5a49;color:white}.tfbtn.answerfalse{border-color:var(--bad);background:#6b3448;color:white}.tfdetail{margin:10px 0 0;padding:10px;border-radius:10px;background:#243959;font-size:.86rem}.shortinput,.essayinput{width:100%;background:#0d1730;color:white;border:1px solid #5970a3;border-radius:13px;padding:15px;outline:0}.essayinput{min-height:140px;resize:vertical}.hint{color:var(--muted);font-size:.82rem;margin-top:10px}.essay-answer{background:#143c38;border:1px solid #277e72;border-radius:17px;padding:14px 17px;margin-top:17px}.essay-answer ol{padding-left:22px}.essay-answer li{margin:8px 0}.endcard{max-width:660px;margin:22px auto;border:1px solid #425981;background:linear-gradient(145deg,#1e305d,#17243e);border-radius:27px;padding:30px 24px;text-align:center}.endcard .trophy{font-size:4.5rem}.endcard h1{font-size:2rem;line-height:1.2}.huge{font-weight:950;font-size:3.2rem;color:var(--gold);margin:13px 0}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}.summary-grid div{padding:13px 5px;background:#0b132c88;border-radius:13px}.summary-grid strong{display:block;font-size:1.3rem}.summary-grid span{font-size:.73rem;color:var(--muted)}.mini-result{padding:12px;text-align:left;border-radius:13px;background:#151d3a;margin:8px 0;color:#dfe7ff;font-size:.85rem}.mini-result b{color:var(--gold)}.endactions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.endactions button{margin:0}.source-links a{color:#90daff}.library-banner{background:#172441;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px;color:#cedaf6}.wronglist{display:grid;gap:8px;margin:20px 0}.wrong{background:#252944;border:1px solid #775766;border-radius:13px;padding:12px;text-align:left}.wrong strong{display:block;color:#ffbac2}.wrong span{display:block;font-size:.85rem;margin-top:5px;color:#cdd6ed} .sr-only{position:absolute;height:1px;width:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(min-width:800px){.modes{grid-template-columns:repeat(3,minmax(0,1fr))}.mode{min-height:177px}.hero{padding:42px}.stats{max-width:710px}.hero p{font-size:1.12rem}}@media(max-width:390px){#app{padding-inline:12px}.header{padding-block:14px}.logo{gap:8px;font-size:.89rem}.logo-icon{width:39px;height:39px;font-size:21px}.hero{padding:23px 18px;border-radius:23px}.hero h1{letter-spacing:-1.1px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:1.15rem}.mode{padding:15px;min-height:160px}.mode strong{font-size:.97rem}.mode .desc{font-size:.78rem}.playcard{padding:15px}.tfbtn{min-width:85px}.endactions{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<script>
'use strict';
const DATA={"mc":[{"id":"LS01","s":"Sử","q":"Hai giai cấp cơ bản trong xã hội phong kiến châu Âu là:","o":["Lãnh chúa phong kiến và nông nô","Tư sản và vô sản","Chủ nô và nô lệ","Địa chủ và nông dân lĩnh canh"],"a":0,"why":"Lãnh chúa chiếm hữu lãnh địa; nông nô sống phụ thuộc và nộp tô cho lãnh chúa.","note":""},{"id":"LS02","s":"Sử","q":"Lực lượng sản xuất chủ yếu trong các lãnh địa phong kiến là ai?","o":["Thương nhân","Nông nô","Lãnh chúa","Chủ xưởng"],"a":1,"why":"Nông nô là lực lượng lao động trực tiếp sản xuất, đặc biệt trong nông nghiệp.","note":""},{"id":"LS03","s":"Sử","q":"Ngành kinh tế chủ yếu trong các thành thị Tây Âu thời trung đại là:","o":["Nông nghiệp tự cấp tự túc","Săn bắt, hái lượm","Thủ công nghiệp và thương nghiệp","Trồng lúa nước"],"a":2,"why":"Thợ thủ công sản xuất hàng hóa và thương nhân trao đổi, buôn bán tại thành thị.","note":""},{"id":"LS04","s":"Sử","q":"Hai giai cấp cơ bản trong xã hội tư bản chủ nghĩa ở châu Âu là:","o":["Lãnh chúa và nông nô","Quý tộc và tăng lữ","Địa chủ và tá điền","Tư sản và vô sản"],"a":3,"why":"Quan hệ sản xuất tư bản chủ nghĩa hình thành hai giai cấp: tư sản sở hữu tư liệu sản xuất và vô sản bán sức lao động.","note":""},{"id":"LS05","s":"Sử","q":"Người Giéc-man chia phần nhiều ruộng đất chiếm được từ chủ nô Rô-ma cũ cho ai?","o":["Nông nô","Tướng lĩnh quân sự và quý tộc","Nô lệ được giải phóng","Các thương nhân nghèo"],"a":1,"why":"Các tướng lĩnh và quý tộc được nhiều ruộng đất, được phong tước, dần hình thành tầng lớp lãnh chúa phong kiến.","note":""},{"id":"LS06","s":"Sử","q":"Cư dân đầu tiên lập nên các thành thị ở Tây Âu thời trung đại chủ yếu là:","o":["Những thợ thủ công rời lãnh địa, cùng với thương nhân tụ họp","Các lãnh chúa sống trong lâu đài","Các vua và quân đội","Nông nô làm nông nghiệp trong lãnh địa"],"a":0,"why":"Từ khoảng thế kỉ XI, một số thợ thủ công tách khỏi nông nghiệp, tập trung nơi thuận tiện giao thương; thương nhân đến buôn bán, thành thị dần hình thành.","note":"Câu gốc không nêu phương án; cách diễn đạt được bổ sung để tránh lẫn với nhóm cư dân sống trong thành thị sau khi hình thành."},{"id":"LS07","s":"Sử","q":"Kinh tế của lãnh địa phong kiến mang tính chất gì?","o":["Kinh tế thị trường hiện đại","Tự cấp, tự túc, khép kín","Ngoại thương là chính","Công nghiệp hóa"],"a":1,"why":"Sản phẩm chủ yếu đáp ứng nhu cầu ngay trong lãnh địa, rất ít trao đổi với bên ngoài.","note":""},{"id":"LS08","s":"Sử","q":"Các cuộc phát kiến địa lí lớn của châu Âu từ thế kỉ XV chủ yếu đi theo con đường nào?","o":["Đường sắt","Đường bộ xuyên sa mạc","Đường hàng không","Đường biển"],"a":3,"why":"Các nhà hàng hải dùng tàu vượt đại dương, mở các tuyến đường biển mới.","note":""},{"id":"LS09","s":"Sử","q":"Ai là người khởi xướng và chỉ huy chuyến thám hiểm đầu tiên đi vòng quanh Trái Đất (1519–1522)?","o":["C. Cô-lôm-bô","V. Ga-ma","Ph. Ma-gien-lăng","B. Đi-a-xơ"],"a":2,"why":"Ma-gien-lăng chỉ huy đoàn khởi hành năm 1519; ông mất tại Phi-líp-pin năm 1521. Êl-ca-nô chỉ huy con tàu còn lại về Tây Ban Nha năm 1522.","note":"Đề gốc viết “Ai là người đầu thực hiện chuyến đi vòng quanh thế giới?”: cần phân biệt người tổ chức/chỉ huy ban đầu với người trực tiếp hoàn thành hành trình."},{"id":"LS10","s":"Sử","q":"Đoàn thám hiểm do C. Cô-lôm-bô chỉ huy đã đặt chân tới châu lục nào (1492)?","o":["Châu Mĩ","Châu Đại Dương","Châu Nam Cực","Châu Phi"],"a":0,"why":"Năm 1492, đoàn Cô-lôm-bô đến các đảo vùng Ca-ri-bê thuộc châu Mĩ.","note":"Châu Mĩ đã có cư dân bản địa sinh sống; “phát hiện” là cách gọi trong bối cảnh lịch sử hàng hải châu Âu."},{"id":"LS11","s":"Sử","q":"Giai cấp tư sản đang lên ở châu Âu đấu tranh chống lại hệ tư tưởng của tôn giáo nào?","o":["Phật giáo","Hồi giáo","Ki-tô giáo do Giáo hội trung đại chi phối","Đạo giáo"],"a":2,"why":"Các nhà tư tưởng Phục hưng phê phán nhiều quan điểm bảo thủ của Giáo hội Ki-tô giáo đương thời, đề cao con người và khoa học.","note":""},{"id":"LS12","s":"Sử","q":"Cuộc đấu tranh vũ trang của nông dân ở châu Âu gắn với phong trào Cải cách tôn giáo là:","o":["Chiến tranh nông dân Đức","Chiến tranh thế giới thứ nhất","Cách mạng tháng Mười Nga","Chiến tranh Trăm năm"],"a":0,"why":"Chiến tranh nông dân Đức (1524–1525) chịu tác động của phong trào Cải cách tôn giáo.","note":"Cách gọi “đầu tiên dưới ngọn cờ tư sản” thuộc diễn giải lịch sử trong tài liệu học tập; không nên hiểu là cuộc nổi dậy nông dân đầu tiên trong toàn bộ lịch sử châu Âu."},{"id":"LS13","s":"Sử","q":"Ai thường được nhắc đến là người mở đầu phong trào Văn hóa Phục hưng?","o":["Ga-li-lê","Đan-tê","Ma-gien-lăng","Cô-lôm-bô"],"a":1,"why":"Đan-tê, tác giả Thần khúc, là nhà thơ lớn của I-ta-li-a, được xem là một trong những người mở đường cho văn hóa Phục hưng.","note":"Khái niệm “mở đầu” mang tính khái quát: Phục hưng là một quá trình văn hóa có nhiều tiền đề và nhân vật."},{"id":"LS14","s":"Sử","q":"Nông dân mất đất, phải làm thuê trong các đồn điền, trang trại và bán sức lao động, trở thành:","o":["Lãnh chúa","Tầng lớp tăng lữ","Giai cấp vô sản (người lao động làm thuê)","Chủ nô"],"a":2,"why":"Người lao động không có tư liệu sản xuất phải bán sức lao động, hình thành lực lượng làm thuê trong quan hệ sản xuất tư bản chủ nghĩa.","note":""},{"id":"LS15","s":"Sử","q":"Trung Quốc trở thành quốc gia phong kiến cường thịnh hàng đầu châu Á dưới triều đại nào?","o":["Nhà Đường","Nhà Thanh","Nhà Tần","Nhà Nguyên"],"a":0,"why":"Thời Đường, kinh tế phát triển, chính quyền được củng cố, lãnh thổ mở rộng, giao thương và văn hóa phát triển.","note":""},{"id":"LS16","s":"Sử","q":"Mầm mống kinh tế tư bản chủ nghĩa bắt đầu xuất hiện ở Trung Quốc vào thời nào?","o":["Nhà Hán","Nhà Đường","Nhà Tống","Nhà Minh (tiếp tục phát triển thời Minh – Thanh)"],"a":3,"why":"Cuối thời Minh, xuất hiện xưởng thủ công thuê mướn lao động với quy mô lớn; xu hướng tiếp tục phát triển dưới thời Thanh.","note":"Trong SGK thường trình bày giai đoạn “Minh – Thanh”; trả lời thời Minh khi hỏi “bắt đầu xuất hiện”."},{"id":"LS17","s":"Sử","q":"Chế độ lấy ruộng đất công, ruộng bỏ hoang chia cho nông dân dưới thời Đường gọi là:","o":["Chế độ quân điền","Chế độ nông nô","Chế độ công xã nguyên thủy","Chế độ chiếm nô"],"a":0,"why":"Nhà Đường thực hiện chính sách quân điền để phân chia một phần ruộng đất cho nông dân canh tác.","note":""},{"id":"LS18","s":"Sử","q":"Vương triều phong kiến cuối cùng trong lịch sử Trung Quốc là:","o":["Nhà Tống","Nhà Minh","Nhà Thanh","Nhà Đường"],"a":2,"why":"Nhà Thanh tồn tại đến năm 1912, khi chế độ quân chủ ở Trung Quốc chấm dứt.","note":""},{"id":"LS19","s":"Sử","q":"Hệ tư tưởng chính thống của giai cấp phong kiến Trung Quốc là:","o":["Phật giáo","Nho giáo","Hồi giáo","Ki-tô giáo"],"a":1,"why":"Nho giáo được sử dụng làm hệ tư tưởng chính thống để tổ chức bộ máy và duy trì trật tự xã hội phong kiến.","note":"Đề gốc dùng từ “tôn giáo nào”; thuật ngữ chính xác hơn trong SGK là “hệ tư tưởng chính thống”."},{"id":"LS20","s":"Sử","q":"Hai vương triều phong kiến “ngoại tộc” ở Trung Quốc là:","o":["Đường và Tống","Hán và Minh","Tần và Hán","Nguyên và Thanh"],"a":3,"why":"Nhà Nguyên do người Mông Cổ lập; nhà Thanh do người Mãn lập.","note":""},{"id":"DL01","s":"Địa","q":"Cơ cấu dân số theo tuổi của châu Âu hiện nay nổi bật ở đặc điểm nào?","o":["Dân số rất trẻ, tỉ lệ trẻ em chiếm đa số","Dân số già, tỉ lệ người từ 65 tuổi trở lên cao và tăng","Dân số chỉ gồm người trong độ tuổi lao động","Không có người cao tuổi"],"a":1,"why":"Châu Âu có cơ cấu dân số già; tỉ lệ người cao tuổi tăng do mức sinh thấp và tuổi thọ cao.","note":""},{"id":"DL02","s":"Địa","q":"Đô thị hóa ở châu Âu có đặc điểm nổi bật nào?","o":["Mức độ đô thị hóa cao, mạng lưới đô thị phát triển","Chưa xuất hiện đô thị","Chủ yếu sống du mục","Tỉ lệ dân thành thị dưới 20%"],"a":0,"why":"Châu Âu đô thị hóa sớm và có mức độ đô thị hóa cao; khoảng 75% dân số sống ở đô thị vào năm 2020.","note":""},{"id":"DL03","s":"Địa","q":"Quy mô kinh tế của Liên minh châu Âu (EU) được mô tả đúng nhất là:","o":["Nền kinh tế nhỏ, ít giao thương","Chỉ dựa vào nông nghiệp","Một trong bốn trung tâm kinh tế lớn của thế giới","Không tham gia thương mại quốc tế"],"a":2,"why":"EU có GDP lớn, hoạt động thương mại – tài chính phát triển, là một trong bốn trung tâm kinh tế lớn trên thế giới.","note":""},{"id":"DL04","s":"Địa","q":"Yếu tố nào thể hiện rõ nhất vị thế trung tâm kinh tế lớn của EU?","o":["Không có thị trường chung","Chỉ xuất khẩu sản phẩm nông nghiệp","Không có doanh nghiệp công nghiệp","GDP lớn, thị trường chung và thương mại – tài chính phát triển"],"a":3,"why":"EU có quy mô GDP lớn và liên kết kinh tế sâu rộng, là trung tâm thương mại – tài chính quan trọng.","note":"Câu gốc hỏi “chủ yếu nhờ yếu tố nào” nhưng không cung cấp phương án; đáp án biên soạn theo biểu hiện tiêu biểu của EU trong SGK."},{"id":"DL05","s":"Địa","q":"Châu Á tiếp giáp trên đất liền với hai châu lục nào?","o":["Châu Âu và châu Phi","Châu Mĩ và châu Phi","Châu Đại Dương và châu Mĩ","Châu Nam Cực và châu Âu"],"a":0,"why":"Phía tây châu Á liền với châu Âu; phía tây nam tiếp giáp châu Phi qua khu vực eo đất Xuy-ê.","note":""},{"id":"DL06","s":"Địa","q":"Dãy núi cao và đồ sộ nhất châu Á và thế giới là:","o":["An-pơ","Hi-ma-lay-a","U-ran","Trường Sơn"],"a":1,"why":"Hi-ma-lay-a có đỉnh Ê-vơ-rét, là khu vực núi cao nhất thế giới.","note":""},{"id":"DL07","s":"Địa","q":"Đặc điểm địa hình nổi bật của châu Á là:","o":["Chỉ có các đồng bằng thấp","Chủ yếu là hoang mạc ven biển","Nhiều hệ thống núi, sơn nguyên cao, đồ sộ, tập trung ở trung tâm","Không có núi cao"],"a":2,"why":"Châu Á có địa hình đa dạng, núi và sơn nguyên cao tập trung nhiều ở trung tâm lục địa.","note":""},{"id":"DL08","s":"Địa","q":"Ý nghĩa lớn nhất của vị trí địa lí và kích thước lãnh thổ rộng lớn đối với thiên nhiên châu Á là:","o":["Làm thiên nhiên giống nhau ở mọi nơi","Chỉ hình thành khí hậu cực","Mọi nơi đều mưa nhiều quanh năm","Làm thiên nhiên phân hóa đa dạng thành nhiều đới và kiểu khí hậu"],"a":3,"why":"Lãnh thổ kéo dài trên nhiều vĩ độ, từ ven biển vào nội địa rất rộng nên khí hậu và thiên nhiên phân hóa đa dạng.","note":""},{"id":"DL09","s":"Địa","q":"Kiểu khí hậu phổ biến trên vùng rộng lớn ở sâu trong nội địa châu Âu là:","o":["Nhiệt đới gió mùa","Ôn đới lục địa","Xích đạo ẩm","Cận xích đạo"],"a":1,"why":"Phần lớn châu Âu thuộc đới ôn đới; phía tây chịu ảnh hưởng hải dương, sâu trong nội địa phổ biến ôn đới lục địa.","note":"Đề gốc hỏi “kiểu khí hậu chiếm phần lớn diện tích châu Âu”, nhưng phải phân biệt “đới ôn đới” với “kiểu ôn đới lục địa”. Câu chơi đã chỉnh rõ phạm vi để chỉ có một đáp án."},{"id":"DL10","s":"Địa","q":"Quy mô dân số châu Âu năm 2020 khoảng bao nhiêu?","o":["747,6 triệu người","447,6 triệu người","1.447,6 triệu người","247,6 triệu người"],"a":0,"why":"Số liệu học liệu lớp 7: khoảng 747,6 triệu người (năm 2020). Không nhầm với dân số EU khoảng 447 triệu người.","note":""},{"id":"DL11","s":"Địa","q":"Nguồn nào KHÔNG thuộc năng lượng tái tạo đang được phát triển ở châu Âu?","o":["Gió","Mặt Trời","Than đá","Thủy năng"],"a":2,"why":"Than đá là nhiên liệu hóa thạch, không tái tạo trên thang thời gian của con người.","note":""},{"id":"DL12","s":"Địa","q":"Nguyên nhân chủ yếu gây ô nhiễm không khí ở châu Âu trước đây là:","o":["Rừng tự nhiên tự phát thải quá nhiều khí độc","Khí thải từ công nghiệp và giao thông dùng nhiên liệu hóa thạch","Do các dòng sông bị ô nhiễm","Do hoạt động thủy triều"],"a":1,"why":"Phát triển công nghiệp và giao thông dựa nhiều vào than, dầu, khí từng tạo ra lượng lớn khí thải và bụi.","note":""}],"tf":[{"id":"LSDS1","s":"Sử","ctx":"Tư liệu: Cô-péc-ních nêu học thuyết Trái Đất tự quay và quay quanh Mặt Trời; học thuyết gặp sự phản đối của Giáo hội. Ga-li-lê bảo vệ các quan điểm thiên văn và chịu sự xét xử của Giáo hội.","st":["Học thuyết của Cô-péc-ních được Giáo hội ủng hộ và khuyến khích phổ biến rộng rãi.","Cô-péc-ních và Ga-li-lê đều nghiên cứu về chuyển động của các hành tinh và Trái Đất.","Thời Phục hưng xuất hiện nhiều nhà khoa học chống quan điểm bảo thủ, làm thay đổi cách nhìn về Trái Đất và vũ trụ.","Câu chuyện cho thấy cần kiên trì đấu tranh cho chân lí khoa học trước khó khăn và áp lực xã hội."],"a":[false,true,true,true],"why":["Học thuyết nhật tâm gặp sự phản đối từ phía các thế lực tôn giáo đương thời.","Cả hai đều có đóng góp đối với thiên văn học và nhận thức về chuyển động của Trái Đất.","Những thành tựu khoa học đã thúc đẩy tư duy lí tính, phê phán nhận thức cũ.","Tinh thần tôn trọng chứng cứ, kiên trì bảo vệ chân lí là bài học từ câu chuyện."],"note":"Tư liệu gốc có chi tiết Ga-li-lê “bị bỏ tù khi 70 tuổi”; chính xác hơn: ông bị xét xử năm 1633 và chịu quản thúc tại gia. Câu nói “Dù sao thì Trái Đất vẫn quay” chưa được xác nhận là lời ông nói tại phiên tòa."},{"id":"LSDS2","s":"Sử","ctx":"Tư liệu Các Mác: việc khai thác vàng, bạc ở châu Mĩ đi cùng chinh phục thuộc địa, áp bức cư dân bản địa và buôn bán nô lệ, gắn với quá trình tích lũy ban đầu của chủ nghĩa tư bản.","st":["Tư liệu trên tập trung nêu nguyên nhân dẫn đến các cuộc phát kiến địa lí.","Việc tìm thấy các mỏ vàng, bạc ở châu Mĩ là kết quả từ cuộc phát kiến của B. Đi-a-xơ.","Các cuộc phát kiến địa lí gắn với nạn buôn bán nô lệ và quá trình cướp bóc thuộc địa.","Bên cạnh tác động tiêu cực, các cuộc phát kiến địa lí cũng mang lại những tác động tích cực cho tiến trình lịch sử."],"a":[false,false,true,true],"why":["Tư liệu chủ yếu đề cập hệ quả tiêu cực và tích lũy tư bản ban đầu, không phải nguyên nhân khởi đầu của phát kiến.","B. Đi-a-xơ đi đến cực Nam châu Phi; châu Mĩ gắn với cuộc đi biển của C. Cô-lôm-bô.","Việc xâm chiếm, bóc lột thuộc địa và buôn bán nô lệ là các tác động tiêu cực quan trọng.","Phát kiến mở tuyến hàng hải, mở rộng tri thức địa lí và giao thương toàn cầu, dù kéo theo nhiều hậu quả nghiêm trọng."],"note":""},{"id":"DLDS13","s":"Địa","ctx":"Ngữ liệu: Đồng bằng chiếm khoảng 2/3 diện tích châu Âu. Núi già ở phía bắc và trung tâm có đỉnh tròn, sườn thoải; núi trẻ phía nam có đỉnh nhọn, sườn dốc. Khí hậu phân hóa từ bắc xuống nam và từ tây sang đông.","st":["Đồng bằng chiếm phần lớn (khoảng 2/3) diện tích châu Âu.","Các dãy núi trẻ phía nam châu Âu có đỉnh tròn, sườn thoải và độ cao trung bình thấp.","Ven biển phía tây châu Âu thường ấm, mưa nhiều hơn sâu trong nội địa phía đông do gió Tây ôn đới và dòng biển nóng.","Địa hình núi châu Âu là trở ngại lớn cho giao thông đường bộ tại vùng đồng bằng Bắc Âu."],"a":[true,false,true,false],"why":["Ngữ liệu cho biết đồng bằng chiếm khoảng hai phần ba diện tích.","Núi trẻ phía nam (như An-pơ) có đỉnh nhọn, sườn dốc; đỉnh tròn sườn thoải là đặc điểm núi già.","Gió Tây ôn đới và dòng biển nóng làm phía tây ôn hòa, ẩm hơn vùng nội địa phía đông.","Địa hình đồng bằng tương đối bằng phẳng, thuận lợi hơn cho giao thông; núi không phải trở ngại lớn ngay tại đồng bằng Bắc Âu."],"note":""},{"id":"DLDS14","s":"Địa","ctx":"Ngữ liệu: Châu Âu quản lí các sông xuyên biên giới như Rai-nơ và Đa-núp; xử lí nước thải, xây dựng hành lang sinh thái ven sông, bảo vệ và phục hồi rừng để gìn giữ tài nguyên nước và đa dạng sinh học.","st":["Sông Rai-nơ và sông Đa-núp là hai ví dụ về quản lí tài nguyên nước xuyên biên giới ở châu Âu.","Chất lượng nước sông hồ châu Âu suy giảm chủ yếu vì lượng mưa hằng năm quá thấp.","Hành lang sinh thái ven sông và bảo vệ rừng góp phần phục hồi hệ sinh thái, đa dạng sinh học và giảm rủi ro thiên tai.","Giải pháp hiệu quả nhất để bảo vệ nước sông là cấm tuyệt đối người dân và doanh nghiệp sử dụng nước sông."],"a":[true,false,true,false],"why":["Đó là các lưu vực sông chảy qua nhiều quốc gia, cần hợp tác quản lí.","Tư liệu chỉ rõ nguyên nhân suy giảm chất lượng nước là công nghiệp và đô thị hóa, xả thải.","Các giải pháp dựa vào hệ sinh thái giúp phục hồi môi trường và tăng khả năng điều tiết nước.","Cần khai thác hợp lí, xử lí nước thải và giám sát; không phải cấm tuyệt đối sử dụng nguồn nước."],"note":""}],"short":[{"id":"DL15","s":"Địa","q":"Sông Vôn-ga — sông dài nhất châu Âu — dài khoảng bao nhiêu ki-lô-mét?","answers":["3690","3530"],"why":"Một số sách học Địa lí 7 dùng khoảng 3.690 km. Bách khoa thư Nga nêu 3.530 km chiều dài hiện nay và 3.690 km trước khi xây dựng các hồ chứa. Game chấp nhận cả hai cách nêu có căn cứ.","note":"Nên thống nhất chuẩn chấm với SGK đang sử dụng tại trường."},{"id":"DL16","s":"Địa","q":"Năm 2020, tỉ lệ dân thành thị châu Âu chiếm khoảng bao nhiêu phần trăm?","answers":["75"],"why":"Theo học liệu SGK lớp 7, năm 2020 dân thành thị châu Âu khoảng 75%.","note":""}],"essays":[{"id":"LSTL1","s":"Sử","q":"Tại sao nói thời Đường là thời kì thịnh vượng của chế độ phong kiến Trung Quốc?","answer":["Nhà nước: tổ chức bộ máy được củng cố; có nhiều chính sách quản lí hiệu quả, mở rộng và bảo vệ lãnh thổ.","Kinh tế: thực hiện chế độ quân điền; sản xuất nông nghiệp tăng; thủ công nghiệp, thương nghiệp phát triển.","Văn hóa – đối ngoại: có nhiều thành tựu về thơ ca, nghệ thuật và giao lưu quốc tế, Con đường tơ lụa sôi động.","Kết luận: Trung Quốc thời Đường đạt trình độ phát triển cao trên nhiều mặt."],"note":""},{"id":"LSTL2","s":"Sử","q":"Liên hệ Việt Nam: từ thế kỉ VII đến thế kỉ XIX, những triều đại phong kiến Trung Quốc nào đã xâm lược hoặc đô hộ nước ta?","answer":["Nhà Đường: đô hộ nước ta trong nhiều thế kỉ, bao gồm giai đoạn từ thế kỉ VII đến đầu thế kỉ X.","Nhà Tống: tiến hành các cuộc xâm lược vào thế kỉ X và XI, tiêu biểu năm 981 và 1075–1077.","Nhà Nguyên: xâm lược Đại Việt ở thế kỉ XIII (các cuộc chiến Mông – Nguyên).","Nhà Minh: xâm lược đầu thế kỉ XV, sau đó đô hộ nước ta.","Nhà Thanh: đem quân xâm lược năm 1788–1789 và bị quân Tây Sơn đánh bại."],"note":"Nên phân biệt thời kì Đường đô hộ với các cuộc chiến tranh xâm lược giành độc lập về sau; nếu chỉ hỏi “xâm lược” theo nghĩa các cuộc chống ngoại xâm thời tự chủ, đáp án cốt lõi là Tống, Nguyên, Minh, Thanh."},{"id":"LSTL3","s":"Sử","q":"Ăng-ghen đánh giá phong trào Văn hóa Phục hưng là cuộc cách mạng tiến bộ, vĩ đại. Em có đồng ý không? Vì sao?","answer":["Đồng ý với nhận định về ý nghĩa tiến bộ của phong trào.","Phong trào phê phán nhiều quan điểm bảo thủ của xã hội phong kiến và Giáo hội đương thời; đề cao giá trị và phẩm giá con người.","Thúc đẩy tinh thần tự do sáng tạo, tư duy khoa học, mở đường cho thành tựu nghệ thuật – văn học – khoa học.","Góp phần chuyển biến tư tưởng và văn hóa châu Âu trong thời kì cận đại."],"note":""},{"id":"LSTL4","s":"Sử","q":"Trình bày hiểu biết của em về “Con đường tơ lụa”.","answer":["Là mạng lưới tuyến thương mại cổ – trung đại, nối Trung Quốc với Trung Á, Tây Á, châu Âu; có cả những tuyến đường biển.","Có tên gọi như vậy vì tơ lụa Trung Quốc là hàng hóa nổi tiếng, ngoài ra còn trao đổi gốm sứ, gia vị, kim loại, sản vật khác.","Không chỉ trao đổi hàng hóa mà còn lan tỏa tri thức, văn hóa, tôn giáo, kĩ thuật giữa các khu vực.","Dưới thời Đường, giao thương trên nhiều tuyến trở nên sôi động."],"note":""},{"id":"DLTL11","s":"Địa","q":"Nêu các giải pháp châu Âu đã áp dụng để giải quyết một trong hai vấn đề: ô nhiễm nước hoặc ô nhiễm không khí.","answer":["Nếu chọn NƯỚC: kiểm soát chất thải, xây dựng hệ thống xử lí nước thải sinh hoạt và công nghiệp, hợp tác quản lí các lưu vực sông chung, phục hồi sông hồ và hành lang sinh thái.","Nếu chọn KHÔNG KHÍ: kiểm soát khí thải công nghiệp và giao thông; dùng công nghệ lọc khí và giao thông sạch; phát triển năng lượng tái tạo; trồng và bảo vệ rừng; phối hợp giữa các nước.","Chỉ cần chọn một trong hai vấn đề, trình bày mạch lạc ít nhất 3 biện pháp phù hợp."],"note":""},{"id":"DLTL12","s":"Địa","q":"Vì sao sử dụng và bảo vệ nguồn nước sông ngòi đặc biệt quan trọng đối với đời sống và sản xuất của cư dân châu Á?","answer":["Sông ngòi cung cấp nước sinh hoạt, tưới tiêu nông nghiệp, nhất là vùng trồng lúa nước.","Cung cấp nguồn lợi thủy sản, giao thông vận tải, thủy điện và phục vụ công nghiệp.","Nhiều nơi ở châu Á phân bố nước không đều, có lũ lụt, hạn hán và ô nhiễm; khai thác quá mức gây rủi ro.","Bảo vệ nguồn nước, chống ô nhiễm, sử dụng tiết kiệm và phối hợp quản lí lưu vực giúp phát triển bền vững."],"note":""},{"id":"DLTL13","s":"Địa","q":"Phân tích đặc điểm phân hóa khí hậu châu Âu.","answer":["Từ bắc xuống nam: cực và cận cực ở phía bắc; ôn đới chiếm diện tích lớn nhất; cận nhiệt Địa Trung Hải ở phía nam.","Từ tây sang đông: ven Đại Tây Dương có kiểu ôn đới hải dương ẩm, tương đối ôn hòa; sâu trong lục địa chuyển sang ôn đới lục địa, mùa đông lạnh, biên độ nhiệt năm lớn, mưa ít hơn.","Theo độ cao: miền núi khí hậu thay đổi theo độ cao địa hình.","Nguyên nhân: lãnh thổ kéo dài trên các vĩ độ, tác động của biển – gió Tây ôn đới – dòng biển nóng và địa hình."],"note":""}]};

function clearTimer(){if(ticker){clearInterval(ticker);ticker=null}}
function logo(){return `<header class="header"><a href="#" class="logo" data-act="home" aria-label="Trang chủ"><span class="logo-icon">📜</span><span>KHÁM PHÁ SỬ · ĐỊA 7<span class="mini" style="display:block;font-weight:600;margin-top:1px">Giữa học kì I • 2026–2027</span></span></a><div class="header-right"><button class="tiny-button" data-act="home" aria-label="Về trang chủ">⌂ Trang chủ</button></div></header>`}
function home(){clearTimer();game=null;let best=getBest();site.innerHTML=logo()+`<main><section class="hero"><div class="eyebrow">✦ HỌC VUI — NHỚ LÂU — TỰ TIN</div><h1>Du hành <em>tri thức</em><br>LỊCH SỬ · ĐỊA LÍ 7</h1><p>Trả lời câu hỏi, tích điểm khám phá và chinh phục kiến thức trước bài kiểm tra giữa kì I. Chơi ngay trên điện thoại, không cần tài khoản.</p><div class="chipline"><span class="chip">🏰 20 câu Lịch sử</span><span class="chip">🌍 12 câu Địa lí</span><span class="chip">🧩 16 nhận định Đúng/Sai</span><span class="chip">✍️ 9 câu ngắn & tự luận</span></div></section><div class="stats"><div class="stat"><strong>45</strong><span>Câu / tình huống</span></div><div class="stat"><strong>07</strong><span>Chế độ chơi</span></div><div class="stat"><strong>0đ</strong><span>Không phí, không đăng nhập</span></div></div><div class="section-title">🚀 Chọn thử thách của em</div><div class="modes">${MODES.map(m=>`<button type="button" class="mode" data-mode="${m.id}"><span class="em" aria-hidden="true">${m.icon}</span><strong>${m.label}</strong><span class="desc">${m.description}</span>${best[m.id]?`<span class="best">★ Kỷ lục: ${best[m.id].pct}%</span>`:''}</button>`).join('')}</div><div class="info-box"><strong>📌 Nhắc nhỏ:</strong> Với các câu trắc nghiệm, bốn phương án được biên soạn từ câu hỏi gốc vì tài liệu học sinh không kèm lựa chọn. Mỗi tình huống Đúng/Sai có đủ bốn ý a, b, c, d. Tự luận là bài tự luyện, không chấm bằng máy. Các câu cần lưu ý về số liệu hoặc cách diễn đạt đều có giải thích.</div></main>`+footer();setHandlers();window.scrollTo(0,0)}
function footer(){return `<footer class="footer">MINI GAME ÔN TẬP LỊCH SỬ – ĐỊA LÍ 7 · Bám theo ngân hàng câu hỏi giữa kì I 2026–2027<br>Điểm cao chỉ lưu trên thiết bị này. Không thu thông tin cá nhân.</footer>`}
function start(mode){clearTimer();let pool=[];let timing=0;if(mode==='su')pool=DATA.mc.filter(q=>q.s==='Sử').map(q=>({...q,type:'mc'}));if(mode==='dia')pool=DATA.mc.filter(q=>q.s==='Địa').map(q=>({...q,type:'mc'}));if(mode==='speed'){pool=mix(DATA.mc).slice(0,12).map(q=>({...q,type:'mc'}));timing=150}if(mode==='tf')pool=DATA.tf.map(q=>({...q,type:'tf'}));if(mode==='short')pool=DATA.short.map(q=>({...q,type:'short'}));if(mode==='essay')pool=DATA.essays.map(q=>({...q,type:'essay'}));if(mode==='full')pool=[...all];game={mode,pool:mode==='full'?pool:mix(pool),idx:0,score:0,maxScore:0,correct:0,total:0,streak:0,maxStreak:0,remaining:timing,answers:[],reply:null,done:false,needsNext:false,essayText:''}; if(timing){ticker=setInterval(()=>{if(!game)return;game.remaining--;let t=document.getElementById('time-value');if(t)t.textContent=timerText(game.remaining);if(game.remaining<=0)finish(true)},1000)}drawPlay()}
function timerText(s){return `${Math.floor(Math.max(0,s)/60)}:${String(Math.max(0,s)%60).padStart(2,'0')}`}
function pval(q){return q.type==='tf'?40:q.type==='essay'?0:100}
function drawPlay(){if(!game)return;const q=game.pool[game.idx];if(!q){finish(false);return}game.reply=null;game.needsNext=false;game.essayText='';let done=game.idx,mode=MODES.find(x=>x.id===game.mode),badge=q.s==='Sử'?'🏰 LỊCH SỬ':'🌍 ĐỊA LÍ';let content='';if(q.type==='mc'){content=`<h2 class="question-title">${E(q.q)}</h2><div class="answers">${q.o.map((a,i)=>`<button class="answer" data-opt="${i}"><span class="letter">${letter[i]}</span><span>${E(a)}</span></button>`).join('')}</div><div id="feedback-target" aria-live="polite"></div>`}
if(q.type==='tf'){content=`<div class="context">${E(q.ctx)}</div><h2 class="question-title" style="margin:16px 0 6px">Đánh giá đầy đủ 4 nhận định:</h2><div id="tf-list">${q.st.map((s,i)=>`<div class="tfrow" id="tfrow-${i}"><div class="tfword"><b>${'abcd'[i]})</b> ${E(s)}</div><div class="tfcontrols"><button class="tfbtn" data-tf="${i}" data-v="true">Đúng</button><button class="tfbtn" data-tf="${i}" data-v="false">Sai</button></div><div class="tfdetail" id="tfdetail-${i}" hidden></div></div>`).join('')}</div><button class="primary" id="tf-check" disabled data-act="check-tf">Chọn đủ 4 ý để chấm</button><div id="feedback-target" aria-live="polite"></div>`;game.reply=[null,null,null,null]}
if(q.type==='short'){content=`<h2 class="question-title">${E(q.q)}</h2><input id="short-value" class="shortinput" type="text" inputmode="numeric" autocomplete="off" placeholder="Nhập con số..." aria-label="Câu trả lời"><div class="hint">Em có thể nhập số với hoặc không có dấu chấm phân cách hàng nghìn.</div><button class="primary" data-act="check-short" id="short-check">Kiểm tra đáp án →</button><div id="feedback-target" aria-live="polite"></div>`}
if(q.type==='essay'){content=`<h2 class="question-title">${E(q.q)}</h2><label for="essay-input" class="hint" style="display:block;margin-bottom:8px">Viết ý chính ra đây trước, rồi mở gợi ý:</label><textarea id="essay-input" class="essayinput" placeholder="Em nghĩ câu trả lời là..."></textarea><button class="primary" data-act="show-essay">📖 Xem gợi ý trả lời</button><div id="feedback-target" aria-live="polite"></div>`}
site.innerHTML=logo()+`<main><div class="subject-head"><div class="subj-label">${E(mode.icon)} ${E(mode.label)}</div><div class="counter">Câu ${game.idx+1} / ${game.pool.length}</div></div><div class="progress"><div style="width:${(done/game.pool.length)*100}%"></div></div><div class="toolbar"><span class="tool">${badge}</span><span class="tool">⭐ <span id="score">${game.score}</span> điểm</span><span class="tool">🔥 <span id="streak">${game.streak}</span> liên tiếp</span>${game.mode==='speed'?`<span class="tool" style="color:var(--gold)">⏱ <span id="time-value">${timerText(game.remaining)}</span></span>`:''}</div><article class="playcard"><div class="question-top"><span class="pill ${q.s==='Địa'?'geo':''}">${q.type==='mc'?'CHỌN 1 ĐÁP ÁN':q.type==='tf'?'ĐÚNG / SAI · 4 Ý':q.type==='short'?'TRẢ LỜI NGẮN':'TỰ LUẬN'}</span><span class="counter">${E(q.id)}</span></div>${content}</article><div class="library-banner">💡 Sau khi trả lời, em sẽ được xem đáp án và giải thích. Dùng nút <b>Tiếp tục</b> để chuyển câu.</div></main>`+footer();setHandlers();window.scrollTo({top:0,behavior:'instant'})}
function updateScore(){let s=document.getElementById('score');if(s)s.textContent=game.score;let t=document.getElementById('streak');if(t)t.textContent=game.streak}
function register(correct,total,pmax,q,response){game.score+=correct*(pmax/total);game.correct+=correct;game.total+=total;game.maxScore+=pmax;if(correct===total){game.streak++;game.maxStreak=Math.max(game.maxStreak,game.streak)}else game.streak=0;game.answers.push({q:q,correct,total,response});game.needsNext=true;updateScore()}
function showNext(){let tgt=document.getElementById('feedback-target'); if(tgt)tgt.insertAdjacentHTML('beforeend',`<button class="next" data-act="next">${game.idx+1===game.pool.length?'Xem thành tích 🏆':'Tiếp tục câu tiếp theo →'}</button>`);setHandlers()}
function answerMC(i){const q=game.pool[game.idx];if(game.needsNext)return;let ok=i===q.a;register(ok?1:0,1,100,q,letter[i]);document.querySelectorAll('[data-opt]').forEach(b=>{let v=Number(b.dataset.opt);b.disabled=true;if(v===q.a)b.classList.add('correct');else if(v===i)b.classList.add('wrong')});let f=document.getElementById('feedback-target');f.innerHTML=`<div class="feedback ${ok?'good':'bad'}"><div class="fbhead">${ok?'🎉 Chính xác! +100 điểm':'🧭 Chưa đúng. Đừng bỏ cuộc nhé!'}</div><p><b>Đáp án: ${letter[q.a]}. ${E(q.o[q.a])}</b></p><p>${E(q.why)}</p>${q.note?`<div class="note">⚠️ ${E(q.note)}</div>`:''}</div>`;showNext()}
function chooseTF(i,v){if(game.needsNext)return;game.reply[i]=v;document.querySelectorAll(`[data-tf="${i}"]`).forEach(b=>b.classList.toggle('active',b.dataset.v===String(v)));let cnt=game.reply.filter(x=>x!==null).length;let c=document.getElementById('tf-check');c.disabled=cnt<4;c.textContent=cnt===4?'✅ Chấm điểm 4 nhận định':`Đã chọn ${cnt}/4 ý`}
function checkTF(){if(game.needsNext||game.reply.some(x=>x===null))return;const q=game.pool[game.idx],r=[...game.reply],cnt=r.filter((x,i)=>x===q.a[i]).length;register(cnt,4,40,q,r);q.st.forEach((s,i)=>{const right=q.a[i];const row=document.getElementById('tfrow-'+i);row.querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.dataset.v===String(right))b.classList.add('answertrue');else if(b.dataset.v===String(r[i]))b.classList.add('answerfalse')});let d=document.getElementById('tfdetail-'+i);d.hidden=false;d.innerHTML=`<b style="color:${right===r[i]?'var(--good)':'var(--bad)'}">${right===r[i]?'✓ Chính xác':'✕ Chưa đúng'} — Đáp án: ${right?'ĐÚNG':'SAI'}</b><div style="margin-top:6px">${E(q.why[i])}</div>`});const ch=document.getElementById('tf-check');ch.disabled=true;ch.textContent='Đã chấm tất cả 4 ý';let f=document.getElementById('feedback-target');f.innerHTML=`<div class="feedback ${cnt===4?'good':'bad'}"><div class="fbhead">${cnt===4?'🌟 Xuất sắc!':cnt>0?'💪 Em đã hiểu thêm rồi!':'📚 Cần ôn lại phần này'}</div><p>Em làm đúng <b>${cnt}/4</b> nhận định và nhận <b>${cnt*10} điểm</b>.</p>${q.note?`<div class="note">⚠️ ${E(q.note)}</div>`:''}</div>`;showNext()}
function normalizeNumber(s){return String(s||'').toLowerCase().replace(/km|triệu|người|\s|%|\.|,/g,'').replace(/[^0-9]/g,'')}
function checkShort(){if(game.needsNext)return;const q=game.pool[game.idx];const inp=document.getElementById('short-value');const r=inp.value.trim();if(!r){inp.focus();return}const v=normalizeNumber(r),yes=q.answers.some(x=>normalizeNumber(x)===v);register(yes?1:0,1,100,q,r);inp.disabled=true;let btn=document.getElementById('short-check');btn.disabled=true;let f=document.getElementById('feedback-target');f.innerHTML=`<div class="feedback ${yes?'good':'bad'}"><div class="fbhead">${yes?'🎯 Chính xác!':'🔍 Cùng xem lại con số nhé!'}</div><p><b>Đáp án chấp nhận: ${q.answers.map(E).join(' hoặc ')}</b>${q.id==='DL15'?' km':q.id==='DL16'?'%':''}.</p><p>${E(q.why)}</p>${q.note?`<div class="note">⚠️ ${E(q.note)}</div>`:''}</div>`;showNext()}
function showEssay(){if(game.needsNext)return;const q=game.pool[game.idx];const inp=document.getElementById('essay-input');const draft=inp.value.trim();game.essayText=draft;game.answers.push({q,correct:0,total:0,response:draft,essay:true});game.needsNext=true;inp.disabled=true;document.querySelector('[data-act="show-essay"]').disabled=true;const f=document.getElementById('feedback-target');f.innerHTML=`<div class="essay-answer"><b>📝 Gợi ý ý chính để đối chiếu</b><ol>${q.answer.map(x=>`<li>${E(x)}</li>`).join('')}</ol>${q.note?`<div class="note">⚠️ ${E(q.note)}</div>`:''}<p class="hint">Tự luận không tính điểm bằng máy. Em hãy đối chiếu câu trả lời của mình theo từng ý.</p></div>`;showNext()}
function next(){if(!game||!game.needsNext)return;game.idx++;if(game.idx>=game.pool.length)finish(false);else drawPlay()}
function finish(timeout){if(!game)return;clearTimer();const g=game;const pct=g.maxScore?Math.round(100*g.score/g.maxScore):0;putBest(g.mode,pct,g.score);const rank=g.maxScore===0?'Nhà tư duy chăm chỉ':pct>=90?'Huyền thoại tri thức':pct>=75?'Chuyên gia khám phá':pct>=50?'Nhà thám hiểm kiên trì':'Mầm non tri thức';const bad=g.answers.filter(x=>x.total>0&&x.correct<x.total);site.innerHTML=logo()+`<main><section class="endcard"><div class="trophy">${pct>=75?'🏆':pct>=50?'🥇':'🌱'}</div><div class="eyebrow">${timeout?'ĐÃ HẾT GIỜ':'HOÀN THÀNH THỬ THÁCH'}</div><h1>${rank}</h1><div class="huge">${g.score} <span style="font-size:1.2rem">điểm</span></div><p style="color:#c9dbf6">${g.maxScore===0?'Hãy tự đối chiếu các ý chính để ghi nhớ.':`Tỉ lệ làm đúng theo trọng số: ${pct}%`}</p><div class="summary-grid"><div><strong>${g.correct}/${g.total}</strong><span>Ý đúng / đã chấm</span></div><div><strong>${g.maxStreak}</strong><span>Chuỗi đúng dài nhất</span></div><div><strong>${g.answers.length}</strong><span>Câu đã làm</span></div></div>${bad.length?`<div class="mini-result"><b>📚 ${bad.length} câu cần ôn lại:</b> ${bad.slice(0,10).map(x=>E(x.q.id)).join(' · ')}${bad.length>10?'…':''}</div>`:''}${timeout?'<p class="hint">Hết giờ: các câu chưa làm không bị tính là đã trả lời sai.</p>':''}<div class="endactions"><button class="secondary" data-act="home">⌂ Chọn chế độ khác</button><button class="primary" data-again="${E(g.mode)}">↻ Chơi lại</button></div>${bad.length?`<button class="secondary" data-act="review" style="width:100%;margin-top:11px">📖 Xem lại câu đã làm sai</button>`:''}</section></main>`+footer();setHandlers();window.scrollTo(0,0)}
function review(){if(!game)return;let wrong=game.answers.filter(x=>x.total>0&&x.correct<x.total);site.innerHTML=logo()+`<main><h1>📖 Ôn lại câu chưa đúng</h1><p style="color:var(--muted)">Đọc lại đáp án đúng và giải thích để lần sau chinh phục trọn vẹn nhé!</p><div class="wronglist">${wrong.map(x=>{const q=x.q;return `<div class="wrong"><strong>${E(q.id)} · ${E(q.type==='tf'?'Tình huống Đúng / Sai':q.q)}</strong>${q.type==='mc'?`<span>✓ ${letter[q.a]}. ${E(q.o[q.a])}</span><span>${E(q.why)}</span>`:q.type==='short'?`<span>✓ ${E(q.answers.join(' hoặc '))}</span><span>${E(q.why)}</span>`:q.st.map((s,i)=>x.response[i]!==q.a[i]?`<span><b>${'abcd'[i]})</b> ${E(s)} <b style="color:var(--good)">${q.a[i]?'Đúng':'Sai'}</b><br>${E(q.why[i])}</span>`:'').join('')}</div>`}).join('')}</div><button class="primary" data-act="home">⌂ Về trang chủ</button></main>`+footer();setHandlers();window.scrollTo(0,0)}
function setHandlers(){document.querySelectorAll('[data-act="home"]').forEach(b=>b.onclick=(ev)=>{ev.preventDefault();if(game&&!game.needsNext&&game.idx>0&&!confirm('Thoát thử thách đang chơi? Điểm lượt này chưa được lưu.'))return;home()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerMC(Number(b.dataset.opt)));document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>chooseTF(Number(b.dataset.tf),b.dataset.v==='true'));document.querySelectorAll('[data-act="check-tf"]').forEach(b=>b.onclick=checkTF);document.querySelectorAll('[data-act="check-short"]').forEach(b=>b.onclick=checkShort);document.querySelectorAll('[data-act="show-essay"]').forEach(b=>b.onclick=showEssay);document.querySelectorAll('[data-act="next"]').forEach(b=>b.onclick=next);document.querySelectorAll('[data-act="review"]').forEach(b=>b.onclick=review);document.querySelectorAll('[data-again]').forEach(b=>b.onclick=()=>start(b.dataset.again));let input=document.getElementById('short-value');if(input)input.onkeydown=e=>{if(e.key==='Enter')checkShort()}}
home();
</script>
</body></html>
